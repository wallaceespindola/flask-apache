[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flask-apache"
version = "1.0.0"
description = "Flask 3 app factory served by Apache httpd, via mod_wsgi or gunicorn behind mod_proxy"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
authors = [{ name = "Wallace Espindola", email = "wallace.espindola@gmail.com" }]
dependencies = ["flask>=3.1", "gunicorn>=23.0"]

[project.urls]
Homepage = "https://github.com/wallaceespindola/flask-apache"
Repository = "https://github.com/wallaceespindola/flask-apache"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "black>=25.1", "isort>=6.0", "ruff>=0.9", "mypy>=1.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/flask_apache"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=flask_apache --cov-report=term-missing --cov-fail-under=80"
