# Apache 2.4 + mod_wsgi, bare metal (Debian/Ubuntu layout).
# Needs a mod_wsgi built for the same Python as the venv (see README).
# Listen 3100 in ports.conf, then: a2ensite flask_apache && systemctl reload apache2
<VirtualHost *:3100>
    ServerName example.com

    WSGIDaemonProcess flask_apache threads=5 \
        python-home=/var/www/flask_apache/.venv \
        python-path=/var/www/flask_apache/src
    WSGIProcessGroup flask_apache
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /var/www/flask_apache/flask_apache.wsgi

    <Directory /var/www/flask_apache>
        <Files flask_apache.wsgi>
            Require all granted
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/flask_apache_error.log
    CustomLog ${APACHE_LOG_DIR}/flask_apache_access.log combined
</VirtualHost>
